[package]
name = "lakekit-core"
description = "The I/O boundary shared by lakekit's table format crates: a store trait for objects and an environment trait for clocks and randomness"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# `TokioEnv`: the system clock, the operating system's randomness, and tokio's timer. Native targets only.
tokio = ["dep:tokio", "dep:getrandom"]

[dependencies]
thiserror.workspace = true
uuid = { version = "1", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"], optional = true }
getrandom = { version = "0.4", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
