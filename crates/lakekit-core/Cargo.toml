[package]
name = "lakekit-core"
description = "The I/O boundary shared by lakekit's table format crates: traits for objects, the clock, and randomness"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# `TokioClock`: the system clock and tokio's timer. Native targets only.
tokio = ["dep:tokio"]
# `OsRandom`: the operating system's random number generator. Native targets only.
getrandom = ["dep:getrandom"]

[dependencies]
thiserror.workspace = true
uuid = { version = "1", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["time"], optional = true }
getrandom = { version = "0.4", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
