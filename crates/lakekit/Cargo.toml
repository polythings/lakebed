[package]
name = "lakekit"
description = "Table formats (Apache Iceberg first) read and written without I/O of their own, for WebAssembly and native"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["iceberg"]
# Apache Iceberg (lakekit-iceberg).
iceberg = ["dep:lakekit-iceberg"]
# Writing Iceberg tables.
iceberg-write = ["iceberg", "lakekit-iceberg/write"]
# Iceberg schemas as Arrow schemas.
iceberg-arrow = ["iceberg", "lakekit-iceberg/arrow"]
# Iceberg statistics from Parquet footers.
iceberg-parquet-stats = ["iceberg", "lakekit-iceberg/parquet-stats"]
# A store over an object_store client (loko-object-store).
object-store = ["dep:loko-object-store"]
# TokioClock, a native clock (lakekit-core/tokio).
tokio = ["lakekit-core/tokio"]
# OsRandom, the operating system's random numbers (lakekit-core/getrandom).
getrandom = ["lakekit-core/getrandom"]

[dependencies]
lakekit-core.workspace = true
lakekit-iceberg = { workspace = true, optional = true }
loko-object-store = { workspace = true, optional = true }

[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
