# Git hooks, run by prek (https://prek.j178.dev): `uv tool install prek && prek install --install-hooks`.
# On commit: formatters and fast checks on the staged files. On push: clippy, natively and for wasm32.
# Everything: `prek run --all-files --hook-stage pre-push`. CI runs the same checks plus the tests.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key

  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: rustfmt --edition 2024
        language: system
        types: [rust]
      - id: clippy
        name: clippy
        entry: cargo clippy --workspace --all-features --all-targets --quiet -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
      - id: clippy-wasm
        name: clippy (wasm32)
        entry: cargo clippy --workspace --all-features --target wasm32-unknown-unknown --quiet -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-push]
