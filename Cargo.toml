[workspace]
resolver = "2"
members = ["crates/lakekit-core", "crates/lakekit-iceberg", "crates/lakekit-object-store", "crates/lakekit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/polythings/lakekit"
keywords = ["lakehouse", "iceberg", "wasm", "table-format"]
categories = ["database-implementations", "wasm"]

[workspace.dependencies]
lakekit-core = { path = "crates/lakekit-core", version = "0.1.0" }
lakekit-iceberg = { path = "crates/lakekit-iceberg", version = "0.1.0", default-features = false }
lakekit-object-store = { path = "crates/lakekit-object-store", version = "0.1.0" }
object_store = { version = "0.14", default-features = false }
url = "2"
thiserror = "2"
serde_json = "1"
apache-avro = { version = "0.22", default-features = false }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# Arrow and Parquet stay on the major that iceberg-rust's newest release (0.10.1) uses, so applications using both
# (Timelake's engine) and the interop tests build one copy of each.
arrow-schema = "58"
parquet = { version = "58", default-features = false }
iceberg = "=0.10.1"
tokio = { version = "1", features = ["macros", "rt"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
allow_attributes = "warn"
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
